name: ${COMPOSE_PROJECT_NAME:-opendeliobot}
services:
  odb:
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${ODB_BASE_IMAGE:-ghcr.io/braand-web/opendeliobot:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${ODB_LOCAL_IMAGE:-opendeliobot-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
      - edge:/run/opendeliobot
    environment:
      ODB_PORT: "8799"
      ODB_WEBHOOK_PORT: "8800"
      # Caddy, in its own container, reaches the server over these (deploy/local/Caddyfile). A request on a socket is
      # never a local one. Caddy does not share the server's network: a server restarted on its own would come back
      # in a new one and leave Caddy, and the port, behind in the old one.
      ODB_TUNNEL_SOCKET: /run/opendeliobot/http.sock
      ODB_WEBHOOK_SOCKET: /run/opendeliobot/hooks.sock
      # The name the desktop app shows for this server (a container's own hostname is a random id).
      ODB_SERVER_NAME: ${ODB_SERVER_NAME:-delio-docker}
      ODB_PUBLIC_URL: ${ODB_PUBLIC_URL:-http://localhost:${ODB_HTTP_PORT:-8080}}
      ODB_WEBHOOK_PUBLIC_URL: ${ODB_WEBHOOK_PUBLIC_URL:-${ODB_PUBLIC_URL:-http://localhost:${ODB_HTTP_PORT:-8080}}}
      # "1": phones pair by QR through Delio Relay (docs/phone-relay-server.md). Sign the
      # container in once first: docker compose exec odb opendeliobot login --relay
      ODB_PHONE_RELAY: ${ODB_PHONE_RELAY:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('opendeliobot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - "${ODB_BIND_ADDRESS:-127.0.0.1}:${ODB_HTTP_PORT:-8080}:80"
    environment:
      ODB_HTTPS_HOST: ${ODB_HTTPS_HOST:-}
      ODB_BIND_ADDRESS: ${ODB_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export ODB_UPSTREAM_SCHEME=http
        if [ -n "$$ODB_HTTPS_HOST" ] && [ "$$ODB_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "ODB_HTTPS_HOST requires ODB_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$ODB_HTTPS_HOST" ]; then
          export ODB_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # Started with the server, not after it is healthy: Caddy reaches it over the socket
    # whenever it answers, so `up` never waits on the server's health, and HTTPS is back
    # as soon as a restarted server is.
    depends_on:
      odb:
        condition: service_started
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge:/run/opendeliobot
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${ODB_DATA_EXTERNAL:-false}
    name: ${ODB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-opendeliobot}_data}
  # The two sockets: in memory, made afresh by the server at each start. Not under /data, which every bot's sandbox
  # sees; the sandbox has its own /run.
  edge:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=1777,size=1m
  caddy_data:
  caddy_config:

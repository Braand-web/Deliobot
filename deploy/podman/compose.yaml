name: ${COMPOSE_PROJECT_NAME:-opendeliobot-podman}
services:
  odb:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/opendeliobot-podman:${ODB_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${ODB_DATA_ROOT:?Run setup.sh first}:${ODB_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/odb-podman.sock
    environment:
      HOME: ${ODB_DATA_ROOT}
      ODB_DATA_DIR: ${ODB_DATA_ROOT}/.opendeliobot
      ODB_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/odb-podman.sock
      ODB_PORT: ${ODB_PORT:-8799}
      ODB_WEBHOOK_PORT: ${ODB_WEBHOOK_PORT:-8800}
      ODB_PUBLIC_URL: ${ODB_PUBLIC_URL:-http://localhost:8080}
      ODB_WEBHOOK_PUBLIC_URL: ${ODB_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$ODB_PORT/api/health | grep -q opendeliobot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      odb:
        condition: service_healthy
    environment:
      ODB_HTTP_PORT: ${ODB_HTTP_PORT:-8080}
      ODB_PORT: ${ODB_PORT:-8799}
      ODB_WEBHOOK_PORT: ${ODB_WEBHOOK_PORT:-8800}
      ODB_HTTPS_HOST: ${ODB_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
